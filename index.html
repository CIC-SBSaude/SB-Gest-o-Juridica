    <script>
      // Intercepta e silencia exclusivamente o erro benigno de WebSocket/HMR do Vite no ambiente de preview do AI Studio
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.toString())) || '';
        if (typeof msg === 'string' && msg.includes('WebSocket closed without opened')) {
          event.preventDefault();
        }
      });
    </script>
